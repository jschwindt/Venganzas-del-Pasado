name: Build & Deploy

on:
  push:
    branches:
      - prod

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate release metadata
        id: release
        shell: bash
        run: |
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          short_sha="${GITHUB_SHA::12}"
          echo "tag=${timestamp}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/vdp/app:${{ steps.release.outputs.tag }}
            ${{ vars.REGISTRY_URL }}/vdp/app:latest
          labels: |
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: ${{ vars.APP_PATH }}/rolling-update.sh deploy ${{ steps.release.outputs.tag }}
